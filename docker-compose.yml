version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - ai-service
    restart: always

  ai-service:
    build: ./ai-service
    ports:
      - "5001:5001"
    env_file: .env
    restart: always

# Note: The client (Frontend) is typically served via CDN (Vercel/Netlify) in production.
# If you wish to run it locally via Docker, ensure VITE_API_URL is set to your host IP.
