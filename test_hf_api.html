<!DOCTYPE html>
<html>
<head>
    <title>Test Hugging Face API</title>
</head>
<body>
    <h1>Test Hugging Face Space API</h1>
    <form id="testForm">
        <input type="text" id="message" value="What are badminton rules?" style="width: 300px;">
        <button type="submit">Test API</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;
            const resultDiv = document.getElementById('result');
            
            try {
                // Test different endpoint formats
                const endpoints = [
                    'https://sportssphere-chatbot.hf.space/api/predict',
                    'https://sportssphere-chatbot.hf.space/run',
                    'https://sportssphere-chatbot.hf.space/api'
                ];

                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            'Accept': 'application/json'
                            },
                            body: JSON.stringify({
                                data: [message]
                            })
                        });
                        
                        const data = await response.text();
                        resultDiv.innerHTML += `<h3>Endpoint: ${endpoint}</h3>`;
                        resultDiv.innerHTML += `<p>Status: ${response.status}</p>`;
                        resultDiv.innerHTML += `<pre>${data.substring(0, 500)}...</pre>`;
                        resultDiv.innerHTML += `<hr>`;
                    } catch (error) {
                        resultDiv.innerHTML += `<h3>Endpoint: ${endpoint}</h3>`;
                        resultDiv.innerHTML += `<p>Error: ${error.message}</p>`;
                        resultDiv.innerHTML += `<hr>`;
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
